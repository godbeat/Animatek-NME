name: Compilar para Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Compilar
      run: cmake --build build --config Release --parallel 4

    - name: Subir ejecutable de Windows
      uses: actions/upload-artifact@v4
      with:
        name: AnimatekNME-Windows
        path: build/AnimatekNME_artefacts/Release/AnimatekNME.exe
